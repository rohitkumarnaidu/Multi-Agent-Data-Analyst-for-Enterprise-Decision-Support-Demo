version: '3.8'

services:
  app:
    build: .
    volumes:
      - .:/app
    # Set host.docker.internal to route back to the Windows host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PYTHONUNBUFFERED=1
    command: python agents/crew.py "What are the top 3 product categories by total sales revenue in our historical data?"
